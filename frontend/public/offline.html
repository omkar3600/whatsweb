<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline • WhatsWeb</title>
    <link rel="icon" href="/whatsweb-logo.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 16px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #059669;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
        }

        .brand-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #0f172a;
        }

        main {
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #64748b;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 0.875rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 280px;
        }

        button, a {
            width: 100%;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background: #059669;
            color: #ffffff;
            border: none;
        }

        .btn-primary:hover {
            background: #047857;
        }

        .btn-secondary {
            background: #ffffff;
            color: #334155;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        footer {
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">W</div>
        <span class="brand-name">WhatsWeb</span>
    </header>

    <main>
        <div class="icon-wrap">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>

        <h1>You&apos;re offline</h1>
        <p>
            Please check your internet connection. We&apos;ll automatically reconnect when you&apos;re back online.
        </p>

        <div class="actions">
            <button class="btn-primary" onclick="retry()">Try again</button>
            <a href="/dashboard" class="btn-secondary">Go to Dashboard</a>
        </div>
    </main>

    <footer>
        WhatsWeb
    </footer>

    <script>
        function retry() {
            window.location.reload();
        }

        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
